AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GenAI Job Search Agent - scans job boards for GenAI security roles

# Variables on Global scale!
Globals:
  Function:
    Timeout: 120
    Runtime: python3.12
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

Resources:
  # Lambda function - job scraper
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: scraper/
      Handler: app.lambda_handler
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:genai-job-agent/*'
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 ? * MON *)
            Description: Run job scraper every Monday at 8AM EST
            Enabled: true
  ScorerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: scorer/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - aws-marketplace:Subscribe
                - aws-marketplace:ViewSubscriptions
              Resource: '*'
  # DynamoDB table - job listings
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: genai-job-agent-listings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ScraperFunction:
    Description: Scraper Lambda Function ARN
    Value: !GetAtt ScraperFunction.Arn
  JobsTable:
    Description: DynamoDB Table Name
    Value: !Ref JobsTable
  ScorerFunction:
    Description: Scorer Lambda Function ARN
    Value: !GetAtt ScorerFunction.Arn
