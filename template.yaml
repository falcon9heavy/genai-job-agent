AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GenAI Job Search Agent - scans job boards for GenAI security roles

Globals:
  Function:
    Timeout: 120
    Runtime: python3.12
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

Parameters:
  NotificationEmail:
    Type: String
    Default: chrisadams27@gmail.com
    Description: Email for weekly digest

Resources:
  # Lambda - job scraper
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: scraper/
      Handler: app.lambda_handler
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:genai-job-agent/*'
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 ? * MON *)
            Description: Run job scraper every Monday at 8AM EST
            Enabled: true

  # Lambda - Bedrock scorer
  ScorerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: scorer/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - aws-marketplace:Subscribe
                - aws-marketplace:ViewSubscriptions
              Resource: '*'
      Events:
        ScorerSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 13 ? * MON *)
            Description: Score new listings 30min after scraper
            Enabled: true

  # Lambda - notifier
  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notifier/
      Handler: app.lambda_handler
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          SENDER_EMAIL: chrisadams27@gmail.com
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        NotifierSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 14 ? * MON *)
            Description: Send notifications 1hr after scraper
            Enabled: true

  # SNS - weekly email digest
  DigestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: genai-job-agent-digest
      DisplayName: Job Agent Weekly Digest

  DigestSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DigestTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # SNS - high-priority SMS + email alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: genai-job-agent-alerts
      DisplayName: Job Agent Alert

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # DynamoDB table
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: genai-job-agent-listings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ScraperFunction:
    Description: Scraper Lambda Function ARN
    Value: !GetAtt ScraperFunction.Arn
  ScorerFunction:
    Description: Scorer Lambda Function ARN
    Value: !GetAtt ScorerFunction.Arn
  NotifierFunction:
    Description: Notifier Lambda Function ARN
    Value: !GetAtt NotifierFunction.Arn
  JobsTable:
    Description: DynamoDB Table Name
    Value: !Ref JobsTable
  DigestTopic:
    Description: Weekly Digest SNS Topic ARN
    Value: !Ref DigestTopic
  AlertTopic:
    Description: High-Priority Alert SNS Topic ARN
    Value: !Ref AlertTopic