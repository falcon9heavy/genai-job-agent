<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Profile Builder — Maxine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836;
    --border: #2e3345; --text: #e4e7f0; --text2: #8b90a5;
    --accent: #8b5cf6; --accent2: #7c3aed; --success: #3ecf8e;
    --warning: #f0b849; --radius: 12px;
  }
  body { font-family: 'DM Sans', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
  .container { max-width: 680px; margin: 0 auto; padding: 0 20px 140px; }
  .header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 20px 0 0; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .progress-ring { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
  .progress-ring svg { width: 52px; height: 52px; }
  .progress-ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .section-nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; -webkit-overflow-scrolling: touch; }
  .section-nav::-webkit-scrollbar { display: none; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px 10px; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; flex-shrink: 0; color: var(--text2); min-width: 60px; font-family: inherit; position: relative; }
  .tab.active { border-bottom-color: var(--accent); color: var(--text); }
  .tab .icon { font-size: 17px; } .tab .label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .tab .badge { position: absolute; top: 4px; right: 4px; font-size: 8px; font-weight: 700; color: #fff; border-radius: 8px; padding: 1px 5px; background: var(--accent); }
  .tab .badge.done { background: var(--success); }
  .section { display: none; padding-top: 28px; } .section.active { display: block; }
  .section-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .section-header .sec-icon { font-size: 34px; }
  .section-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .section-header .sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .field-group { margin-bottom: 24px; }
  .field-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  input[type="text"], textarea { width: 100%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; font-family: inherit; outline: none; transition: border 0.2s; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  ::placeholder { color: var(--text2); opacity: 0.6; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: inherit; user-select: none; }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--border); z-index: 50; max-width: 680px; margin: 0 auto; }
  .nav-btn { padding: 10px 20px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav-btn.export-btn { background: var(--success); border-color: var(--success); color: #fff; }
  .nav-center { font-size: 11px; color: var(--text2); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; padding: 28px 24px; max-width: 500px; width: 100%; border: 1px solid var(--border); }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .modal p { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 12px; }
  .modal .quote { background: var(--surface2); border-radius: var(--radius); padding: 12px 16px; font-size: 14px; font-style: italic; margin: 12px 0 16px; line-height: 1.5; color: var(--text); border-left: 3px solid var(--accent); }
  .modal .export-text { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--text2); max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; margin: 12px 0; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { padding: 10px 20px; border-radius: var(--radius); border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .modal-actions .copy-btn { background: var(--accent); color: #fff; }
  .modal-actions .close-btn { background: var(--surface2); color: var(--text); }
  @media (max-width: 480px) { .header h1 { font-size: 18px; } .tab { padding: 6px 8px 8px; min-width: 50px; } .tab .icon { font-size: 15px; } .tab .label { font-size: 8px; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Job Profile Builder</h1>
        <p>Maxine's job search starts here</p>
      </div>
      <div class="progress-ring">
        <svg viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="#2e3345" stroke-width="4"/>
          <circle id="progress-arc" cx="26" cy="26" r="22" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="0 138.2" stroke-linecap="round" transform="rotate(-90 26 26)" style="transition: stroke-dasharray 0.4s ease, stroke 0.3s"/>
        </svg>
        <span class="pct" id="progress-pct">0%</span>
      </div>
    </div>
    <div class="section-nav" id="section-nav"></div>
  </div>
  <div id="sections-container"></div>
</div>
<div class="nav-bar">
  <button class="nav-btn" id="btn-back" onclick="navigate(-1)">← Back</button>
  <div class="nav-center" id="save-status"></div>
  <button class="nav-btn primary" id="btn-next" onclick="navigate(1)">Next →</button>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Profile Ready! 🎉</h3>
    <p>Your answers have been copied to your clipboard. Send this to Dad so he can set up your job agent.</p>
    <div class="quote">Text or email the copied text to Dad — he'll plug it into your job search agent.</div>
    <div class="export-text" id="export-preview"></div>
    <p id="modal-progress"></p>
    <div class="modal-actions">
      <button class="copy-btn" id="copy-btn" onclick="copyExport()">Copy Again</button>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>
<script>
const SECTIONS = [
  { id:"basics", title:"The Basics", subtitle:"Let's start with who you are", icon:"👋", fields:[
    {id:"fullName",label:"Full Name",type:"text",placeholder:"Maxine Adams"},
    {id:"email",label:"Email",type:"text",placeholder:"your@email.com"},
    {id:"phone",label:"Phone",type:"text",placeholder:"610-555-1234"},
    {id:"currentLocation",label:"Where do you live right now?",type:"text",placeholder:"Pittsburgh, PA"},
    {id:"linkedIn",label:"LinkedIn URL",type:"text",placeholder:"https://linkedin.com/in/..."},
    {id:"portfolio",label:"Portfolio / Personal Site (if any)",type:"text",placeholder:"https://..."},
  ]},
  { id:"target", title:"What You Want", subtitle:"Dream job vibes — be honest, not modest", icon:"🎯", fields:[
    {id:"targetRoles",label:"What job titles are you targeting? (pick all that apply)",type:"multi",
      options:["Archivist","Librarian","Library Assistant / Technician","Museum Curator / Associate","Digital Collections Specialist","Records Manager","Student Affairs Coordinator","Academic Advisor","Program Coordinator (Higher Ed)","Program Coordinator (Nonprofit)","Community Engagement Specialist","Grant Writer","Research Assistant / Associate","Administrative Coordinator","Event Coordinator","Communications / Content Specialist","Social Worker (BSW/MSW)","Policy Analyst / Researcher","Other"]},
    {id:"targetRolesOther",label:"If 'Other', what roles?",type:"text",placeholder:"e.g. Development Associate, Public History..."},
    {id:"dreamOrgType",label:"What kind of organization excites you most? (pick all)",type:"multi",
      options:["University / Higher Education","Public Library System","Research Library / Special Collections","Museum / Cultural Institution","Government Archive (NARA, LOC, state)","Nonprofit / NGO","Community Organization","Think Tank / Policy Institute","Publishing","K-12 Education","Social Services Agency","Don't care — it's about the role"]},
    {id:"dreamOrgs",label:"Any specific organizations you'd love to work at?",type:"textarea",placeholder:"Library of Congress, Smithsonian, Carnegie Library, specific universities..."},
    {id:"orgSize",label:"Preferred organization size?",type:"single",options:["Small (< 50)","Mid-size (50-500)","Large (500+)","No preference"]},
    {id:"dealbreakers",label:"Any dealbreakers? Things you absolutely don't want?",type:"textarea",placeholder:"e.g. no corporate, no defense, must be mission-driven..."},
  ]},
  { id:"location", title:"Location & Remote", subtitle:"Where in the world do you want to work?", icon:"🌍", fields:[
    {id:"remotePreference",label:"Remote preference?",type:"single",
      options:["Fully remote only","Remote preferred, open to hybrid","Hybrid preferred","On-site is fine","No preference"]},
    {id:"targetCities",label:"What cities are you open to? (pick all)",type:"multi",
      options:["Pittsburgh","Philadelphia","New York City","Washington DC","Boston","Chicago","Los Angeles","San Francisco","Miami / South Florida","São Paulo / Brazil","Anywhere remote","Other"]},
    {id:"targetCitiesOther",label:"Other cities?",type:"text",placeholder:"e.g. Baltimore, Austin, Denver..."},
    {id:"willingToRelocate",label:"Would you relocate for the right opportunity?",type:"single",
      options:["Yes, definitely","Maybe, depends on the offer","Prefer not to","Absolutely not"]},
  ]},
  { id:"skills", title:"Skills & Strengths", subtitle:"What makes you, you", icon:"💪", fields:[
    {id:"topSkills",label:"Which of these are your strengths? (pick all that apply)",type:"multi",
      options:["Research & Analysis","Archival Processing / Metadata","Digital Curation","Project Management","Event Planning & Coordination","Writing & Editing","Public Speaking / Facilitation","Community Outreach","Grant Writing","Teaching / Tutoring","Social Media Management","Data Entry / Records Management","Oral History / Interviewing","Translation (Portuguese)","WordPress / CMS","Microsoft Office / Google Workspace","Museum Collection Management (TMS)","Metadata Standards (Dublin Core, DACS, MARC)"]},
    {id:"strongestSkill",label:"If you had to pick ONE thing you're best at, what is it?",type:"text",placeholder:"e.g. Research and writing about Latin American history"},
    {id:"growingSkills",label:"What skills are you actively learning or want to grow?",type:"textarea",placeholder:"e.g. ArchivesSpace, digital preservation, MARC cataloging, GIS..."},
    {id:"certifications",label:"Certifications or special training",type:"textarea",placeholder:"e.g. Archival certifications, MLIS in progress..."},
    {id:"languages",label:"Languages spoken",type:"text",placeholder:"e.g. English (native), Brazilian Portuguese (professional)"},
  ]},
  { id:"experience", title:"Experience & Story", subtitle:"Help us understand your journey", icon:"📖", fields:[
    {id:"currentRole",label:"What's your current role / most recent position?",type:"text",placeholder:"Guest Services Assistant at University of Pittsburgh"},
    {id:"currentRoleLike",label:"What do you like most about your current/recent work?",type:"textarea",placeholder:"Be specific — what energizes you?"},
    {id:"currentRoleDislike",label:"What do you like least?",type:"textarea",placeholder:"What drains you or feels limiting?"},
    {id:"whyLooking",label:"Why are you looking for something new?",type:"textarea",placeholder:"Growth, mission alignment, wanting to use your degree..."},
    {id:"proudProject",label:"What project or accomplishment are you most proud of?",type:"textarea",placeholder:"Your thesis, Smithsonian internship, an event you organized..."},
    {id:"researchInterests",label:"What are your research interests or passions?",type:"textarea",placeholder:"Latin American history, oral histories, digital archives, social justice..."},
  ]},
  { id:"education", title:"Education & Future", subtitle:"Where you've been and where you're headed", icon:"🎓", fields:[
    {id:"degree",label:"Highest degree completed",type:"text",placeholder:"BA in History, University of Pittsburgh"},
    {id:"gradSchool",label:"Are you considering graduate school?",type:"single",
      options:["Yes, MLIS / Library Science","Yes, MSW / Social Work","Yes, MA / PhD in History or related","Yes, other graduate program","Not right now","No plans for grad school"]},
    {id:"gradSchoolDetails",label:"If yes, any specific programs or timeline?",type:"textarea",placeholder:"e.g. Applying to Pitt MLIS in Fall 2027..."},
    {id:"academicGoals",label:"Where do you see yourself in 3-5 years?",type:"textarea",placeholder:"Working in archives? Running community programs? In grad school? Be honest."},
  ]},
  { id:"compensation", title:"Money & Benefits", subtitle:"Let's talk numbers — stays between us", icon:"💰", fields:[
    {id:"currentSalary",label:"Current / most recent compensation (approximate)",type:"text",placeholder:"$XX,XXX or hourly rate"},
    {id:"targetSalary",label:"Target compensation for next role",type:"text",placeholder:"$XX,XXX – $XX,XXX"},
    {id:"minimumSalary",label:"Absolute minimum you'd accept",type:"text",placeholder:"$XX,XXX"},
    {id:"benefitsPriority",label:"What benefits matter most? (pick top 3)",type:"multi",
      options:["Health insurance","Retirement / pension","Tuition remission / education benefits","PTO / vacation","Remote flexibility","Professional development funding","Student loan assistance","Flexible hours","Mission-driven culture"]},
    {id:"housingHelp",label:"Do you need relocation assistance or housing support?",type:"single",
      options:["Yes, essential","Would be nice","No, I'm flexible","N/A — staying local"]},
  ]},
  { id:"preferences", title:"Work Style & Culture", subtitle:"The intangibles that matter", icon:"🧠", fields:[
    {id:"workStyle",label:"How do you work best?",type:"single",
      options:["Heads-down deep focus — research and writing","Collaborative — I thrive with people","Mix of both depending on the task"]},
    {id:"managementStyle",label:"What kind of supervisor do you want?",type:"single",
      options:["Hands-off — trust me and let me run","Mentor — guide me and help me grow","Structured — clear expectations, regular check-ins","No preference"]},
    {id:"teamSize",label:"Preferred team size?",type:"single",options:["Solo / very small (2-3)","Small (4-8)","Medium (8-15)","Large (15+)","No preference"]},
    {id:"cultureValues",label:"Describe your ideal work culture",type:"textarea",placeholder:"e.g. mission-driven, inclusive, values social justice, collaborative..."},
    {id:"interviewComfort",label:"How confident are you about interviews right now?",type:"single",
      options:["Confident — bring it on","Decent — could use practice","Nervous — need to prep","Haven't done one in a while"]},
  ]},
  { id:"timeline", title:"Timeline & Urgency", subtitle:"How fast are we moving?", icon:"⏰", fields:[
    {id:"urgency",label:"How urgently are you looking?",type:"single",
      options:["ASAP — actively searching now","Next 1-3 months","Next 3-6 months — exploring","No rush — just seeing what's out there"]},
    {id:"currentlyApplying",label:"Have you started applying anywhere?",type:"single",
      options:["Yes, actively applying","A few applications out","No, haven't started","Just browsing job boards"]},
    {id:"interviews",label:"Any interviews or conversations in progress?",type:"textarea",placeholder:"Organizations, stages, etc."},
    {id:"availability",label:"When could you start a new role?",type:"text",placeholder:"e.g. immediately, 2 weeks notice, after May..."},
    {id:"otherNotes",label:"Anything else we should know?",type:"textarea",placeholder:"Grad school plans, visa needs, side projects, anything relevant..."},
  ]},
];
const STORAGE_KEY="maxine-job-profile"; let data={}, currentSection=0;
function init(){const s=localStorage.getItem(STORAGE_KEY);if(s){try{data=JSON.parse(s)}catch(e){}}buildNav();buildSections();showSection(0);updateProgress()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));const el=document.getElementById("save-status");el.textContent="✓ Saved";el.style.color="#3ecf8e";setTimeout(()=>{el.style.color=""},1500)}
function buildNav(){document.getElementById("section-nav").innerHTML=SECTIONS.map((s,i)=>`<button class="tab${i===0?' active':''}" id="tab-${i}" onclick="showSection(${i})"><span class="icon">${s.icon}</span><span class="label">${s.title}</span><span class="badge" id="badge-${i}" style="display:none"></span></button>`).join('')}
function buildSections(){const c=document.getElementById("sections-container");c.innerHTML=SECTIONS.map((s,i)=>`<div class="section${i===0?' active':''}" id="section-${i}"><div class="section-header"><span class="sec-icon">${s.icon}</span><div><h2>${s.title}</h2><div class="sub">${s.subtitle}</div></div></div>${s.fields.map(f=>buildField(f)).join('')}</div>`).join('');SECTIONS.forEach(s=>s.fields.forEach(f=>{if(f.type==='text'||f.type==='textarea'){const el=document.getElementById('f-'+f.id);if(el&&data[f.id])el.value=data[f.id]}}));updateAllPills()}
function buildField(f){let input='';if(f.type==='text')input=`<input type="text" id="f-${f.id}" placeholder="${f.placeholder||''}" oninput="updateField('${f.id}',this.value)">`;else if(f.type==='textarea')input=`<textarea id="f-${f.id}" placeholder="${f.placeholder||''}" rows="3" oninput="updateField('${f.id}',this.value)"></textarea>`;else if(f.type==='single')input=`<div class="options" id="opts-${f.id}">`+f.options.map(o=>`<button class="pill" onclick="selectSingle('${f.id}',this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')+'</div>';else if(f.type==='multi')input=`<div class="options" id="opts-${f.id}">`+f.options.map(o=>`<button class="pill" onclick="toggleMulti('${f.id}',this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')+'</div>';return `<div class="field-group"><label>${f.label}</label>${input}</div>`}
function updateField(id,val){data[id]=val;save();updateProgress()}
function selectSingle(id,btn,val){data[id]=val;btn.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('selected'));btn.classList.add('selected');save();updateProgress()}
function toggleMulti(id,btn,val){if(!data[id])data[id]=[];const idx=data[id].indexOf(val);if(idx>-1){data[id].splice(idx,1);btn.classList.remove('selected')}else{data[id].push(val);btn.classList.add('selected')}save();updateProgress()}
function updateAllPills(){SECTIONS.forEach(s=>s.fields.forEach(f=>{if(f.type==='single'&&data[f.id]){const c=document.getElementById('opts-'+f.id);if(c)c.querySelectorAll('.pill').forEach(p=>{if(p.textContent===data[f.id])p.classList.add('selected')})}if(f.type==='multi'&&data[f.id]){const c=document.getElementById('opts-'+f.id);if(c)c.querySelectorAll('.pill').forEach(p=>{if(data[f.id].includes(p.textContent))p.classList.add('selected')})}}))}
function showSection(idx){currentSection=idx;document.querySelectorAll('.section').forEach((s,i)=>s.classList.toggle('active',i===idx));document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));document.getElementById('btn-back').disabled=idx===0;const next=document.getElementById('btn-next');if(idx===SECTIONS.length-1){next.textContent='📋 Export Profile';next.className='nav-btn export-btn';next.onclick=showExport}else{next.textContent='Next →';next.className='nav-btn primary';next.onclick=()=>navigate(1)}window.scrollTo({top:0,behavior:'smooth'})}
function navigate(dir){const n=currentSection+dir;if(n>=0&&n<SECTIONS.length)showSection(n)}
function updateProgress(){let filled=0,total=0;SECTIONS.forEach((s,si)=>{let sf=0;s.fields.forEach(f=>{total++;const v=data[f.id];if(v&&((typeof v==='string'&&v.trim())||(Array.isArray(v)&&v.length>0))){filled++;sf++}});const b=document.getElementById('badge-'+si);if(b){if(sf>0){b.style.display='inline';b.textContent=sf+'/'+s.fields.length;b.className=sf===s.fields.length?'badge done':'badge'}else b.style.display='none'}});const pct=Math.round((filled/total)*100);document.getElementById('progress-arc').setAttribute('stroke-dasharray',`${(pct/100)*138.2} 138.2`);document.getElementById('progress-arc').setAttribute('stroke',pct===100?'#3ecf8e':'#8b5cf6');document.getElementById('progress-pct').textContent=pct+'%'}
function generateExport(){let o="MAXINE'S JOB PROFILE\nExported: "+new Date().toLocaleDateString()+"\n"+"=".repeat(40)+"\n\n";SECTIONS.forEach(s=>{o+=s.icon+" "+s.title.toUpperCase()+"\n"+"-".repeat(30)+"\n";let has=false;s.fields.forEach(f=>{const v=data[f.id];if(v&&((typeof v==='string'&&v.trim())||(Array.isArray(v)&&v.length>0))){has=true;o+=f.label+"\n";o+="  → "+(Array.isArray(v)?v.join(", "):v)+"\n\n"}});if(!has)o+="(not filled out yet)\n";o+="\n"});return o}
function showExport(){const t=generateExport();document.getElementById('export-preview').textContent=t;const p=document.getElementById('progress-pct').textContent;document.getElementById('modal-progress').textContent=p==='100%'?"You've completed everything — nice work! 💪":"You're at "+p+" so far. You can come back to finish — your answers are saved.";document.getElementById('modal').classList.add('show');copyExport()}
function copyExport(){const t=generateExport();navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('copy-btn');b.textContent='✓ Copied!';setTimeout(()=>{b.textContent='Copy Again'},2000)}).catch(()=>{const p=document.getElementById('export-preview');const r=document.createRange();r.selectNodeContents(p);window.getSelection().removeAllRanges();window.getSelection().addRange(r)})}
function closeModal(){document.getElementById('modal').classList.remove('show')}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
